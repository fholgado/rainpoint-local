# Primary installation-specific garden dashboard powered by local RF telemetry.
title: Garden
views:
  - title: Garden
    path: garden
    icon: mdi:flower
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: markdown
            content: >-
              **Local RainPoint telemetry and control.** Moisture readings,
              freshness checks, watering decisions, and the paired HTV405 valve
              now use `rainpoint_local`. Garden watering uses Zone 1; HTV405
              battery remains unavailable until its RF field is independently
              validated.
          - type: heading
            heading: Garden Moisture
            heading_style: title
            icon: mdi:water-percent
          - type: gauge
            name: Left Bed
            entity: sensor.left_bed_soil_moisture
            min: 0
            max: 100
            needle: true
            severity:
              red: 0
              yellow: 35
              green: 45
          - type: gauge
            name: Right Bed
            entity: sensor.right_bed_soil_moisture
            min: 0
            max: 100
            needle: true
            severity:
              red: 0
              yellow: 35
              green: 45
          - type: gauge
            name: Test Sensor A
            entity: sensor.rainpoint_hcs026_9bce0024_soil_moisture
            min: 0
            max: 100
            needle: true
            severity:
              red: 0
              yellow: 35
              green: 45
          - type: gauge
            name: Test Sensor B
            entity: sensor.rainpoint_hcs026_95a98024_soil_moisture
            min: 0
            max: 100
            needle: true
            severity:
              red: 0
              yellow: 35
              green: 45
          - type: statistics-graph
            title: Moisture Trend
            chart_type: line
            days_to_show: 2
            period: hour
            stat_types:
              - mean
            entities:
              - sensor.left_bed_soil_moisture
              - sensor.right_bed_soil_moisture
              - sensor.rainpoint_hcs026_9bce0024_soil_moisture
              - sensor.rainpoint_hcs026_95a98024_soil_moisture
      - type: grid
        cards:
          - type: heading
            heading: Garden Schedule
            heading_style: title
            icon: mdi:calendar-clock
          - type: tile
            entity: input_boolean.garden_watering_season_enabled
            name: Watering Season
            icon: mdi:sprout
            color: green
            vertical: false
          - type: tile
            entity: binary_sensor.garden_watering_needed
            name: Watering Needed
            icon: mdi:sprinkler-variant
            color: blue
            vertical: false
          - type: tile
            entity: sensor.garden_soil_moisture_lowest
            name: Driest Sensor
            icon: mdi:water-percent
            color: teal
            vertical: false
          - type: tile
            entity: sensor.garden_htv405_4_zone_water_timer_8013_control_request_status
            name: Run Now Status
            icon: mdi:list-status
            color: blue
            vertical: false
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.garden_htv405_4_zone_water_timer_8013
                state: "on"
            card:
              type: button
              entity: binary_sensor.garden_htv405_4_zone_water_timer_8013
              name: Run Now
              icon: mdi:sprinkler-variant
              show_state: false
              tap_action:
                action: call-service
                service: script.garden_run_manual_watering_program
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.garden_htv405_4_zone_water_timer_8013
                state_not: "on"
            card:
              type: button
              entity: sensor.garden_htv405_4_zone_water_timer_8013_control_request_status
              name: Run Now
              icon: mdi:progress-clock
              show_state: true
              tap_action:
                action: none
          - type: entities
            title: Decision Settings
            show_header_toggle: false
            entities:
              - entity: input_datetime.garden_watering_start_time
                name: Start Time
              - entity: input_number.garden_watering_moisture_threshold
                name: Moisture Threshold
              - entity: input_number.garden_watering_duration
                name: Duration
              - entity: input_number.garden_watering_rain_probability_threshold
                name: Rain Probability
              - entity: input_number.garden_watering_meaningful_rain_amount
                name: Meaningful Rain
              - entity: sensor.nws_irrigation_rain_probability_next_18_hours
                name: NWS Rain Probability
              - entity: sensor.nws_irrigation_rain_amount_next_24_hours
                name: NWS Rain Amount
          - type: entities
            title: Last Decision
            show_header_toggle: false
            entities:
              - entity: input_datetime.garden_watering_last_checked
                name: Last Checked
              - entity: input_datetime.garden_watering_last_ran
                name: Last Ran
              - entity: input_text.garden_watering_last_rain_forecast
                name: Rain Forecast
              - entity: input_text.garden_watering_last_decision
                name: Decision
      - type: grid
        cards:
          - type: heading
            heading: Garden Watering Today
            heading_style: title
            icon: mdi:sprinkler-variant
          - type: tile
            entity: sensor.rainpoint_4_zone_valve_8013_reported_duration
            name: Session Duration
            icon: mdi:timer-outline
            color: teal
            vertical: false
          - type: history-graph
            title: Watering Activity
            hours_to_show: 24
            entities:
              - entity: binary_sensor.rainpoint_4_zone_valve_8013_zone_1_watering
                name: Zone 1
      - type: grid
        cards:
          - type: heading
            heading: Garden Valve
            heading_style: title
            icon: mdi:valve
          - type: tile
            entity: valve.rainpoint_4_zone_valve_8013_zone_1
            name: Zone 1
            icon: mdi:valve
            color: green
            features:
              - type: valve-open-close
          - type: tile
            entity: number.rainpoint_4_zone_valve_8013_zone_1_duration_2
            name: Zone Duration
            icon: mdi:timer-cog-outline
            color: amber
          - type: tile
            entity: sensor.rainpoint_4_zone_valve_8013_device_report_time
            name: Last Valve Report
            icon: mdi:clock-check-outline
            color: amber
          - type: entities
            title: Local Valve Report
            show_header_toggle: false
            entities:
              - entity: sensor.rainpoint_4_zone_valve_8013_valve_state
                name: Valve State
              - entity: sensor.rainpoint_4_zone_valve_8013_reported_duration
                name: Reported Duration
          - type: entities
            title: Device Health
            show_header_toggle: false
            entities:
              - entity: sensor.rainpoint_4_zone_valve_8013_battery
                name: Valve Battery (not decoded)
              - entity: sensor.left_bed_battery
                name: Left Sensor Battery
              - entity: sensor.right_bed_battery
                name: Right Sensor Battery
              - entity: sensor.rainpoint_hcs026_9bce0024_battery
                name: Test Sensor A Battery
              - entity: sensor.rainpoint_hcs026_95a98024_battery
                name: Test Sensor B Battery
              - entity: sensor.rainpoint_4_zone_valve_8013_signal_strength
                name: Valve Signal
              - entity: sensor.left_bed_signal_strength
                name: Left Sensor Signal
              - entity: sensor.right_bed_signal_strength
                name: Right Sensor Signal
              - entity: sensor.rainpoint_hcs026_9bce0024_signal_strength
                name: Test Sensor A Signal
              - entity: sensor.rainpoint_hcs026_95a98024_signal_strength
                name: Test Sensor B Signal
              - entity: sensor.left_bed_device_report_time
                name: Left Sensor Last Report
              - entity: sensor.right_bed_device_report_time
                name: Right Sensor Last Report
              - entity: sensor.rainpoint_hcs026_9bce0024_device_report_time
                name: Test Sensor A Last Report
              - entity: sensor.rainpoint_hcs026_95a98024_device_report_time
                name: Test Sensor B Last Report
          - type: entities
            title: Receive Reliability
            show_header_toggle: false
            entities:
              - entity: binary_sensor.rainpoint_4_zone_valve_8013_reporting
                name: Valve Reporting
              - entity: binary_sensor.left_bed_reporting
                name: Left Sensor Reporting
              - entity: binary_sensor.right_bed_reporting
                name: Right Sensor Reporting
              - entity: binary_sensor.rainpoint_hcs026_9bce0024_reporting
                name: Test Sensor A Reporting
              - entity: binary_sensor.rainpoint_hcs026_95a98024_reporting
                name: Test Sensor B Reporting
              - entity: sensor.rainpoint_4_zone_valve_8013_average_report_interval
                name: Valve Average Interval
              - entity: sensor.left_bed_average_report_interval
                name: Left Average Interval
              - entity: sensor.right_bed_average_report_interval
                name: Right Average Interval
              - entity: sensor.rainpoint_4_zone_valve_8013_reports_received
                name: Valve Reports Received
              - entity: sensor.left_bed_reports_received
                name: Left Reports Received
              - entity: sensor.right_bed_reports_received
                name: Right Reports Received
              - entity: sensor.rainpoint_hcs026_9bce0024_reports_received
                name: Test Sensor A Reports Received
              - entity: sensor.rainpoint_hcs026_95a98024_reports_received
                name: Test Sensor B Reports Received
          - type: history-graph
            title: Report Cadence
            hours_to_show: 24
            entities:
              - entity: sensor.left_bed_last_report_interval
                name: Left Bed
              - entity: sensor.right_bed_last_report_interval
                name: Right Bed
              - entity: sensor.test_sensor_a_last_report_interval
                name: Test Sensor A
              - entity: sensor.test_sensor_b_last_report_interval
                name: Test Sensor B
  - title: Front Yard
    path: front-yard
    icon: mdi:flower-tulip
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: markdown
            content: >-
              **Local RF telemetry and control.** The front irrigation uses the
              RainPoint single-zone valve through the Front Yard radio. Soil
              readings and valve confirmations come from `rainpoint_local`.
          - type: heading
            heading: Front Yard Moisture
            heading_style: title
            icon: mdi:water-percent
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.front_yard_sensor_1_reporting
                state: "on"
            card:
              type: gauge
              name: Plant Bed 1
              entity: sensor.front_yard_sensor_1_soil_moisture
              min: 0
              max: 100
              needle: true
              severity:
                red: 0
                yellow: 35
                green: 45
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.front_yard_sensor_1_reporting
                state_not: "on"
            card:
              type: gauge
              name: ⚠ Plant Bed 1 — stale
              entity: sensor.front_yard_sensor_1_soil_moisture
              min: 0
              max: 100
              needle: true
              severity:
                red: 0
                yellow: 35
                green: 45
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.front_yard_sensor_2_reporting
                state: "on"
            card:
              type: gauge
              name: Plant Bed 2
              entity: sensor.front_yard_sensor_2_soil_moisture
              min: 0
              max: 100
              needle: true
              severity:
                red: 0
                yellow: 35
                green: 45
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.front_yard_sensor_2_reporting
                state_not: "on"
            card:
              type: gauge
              name: ⚠ Plant Bed 2 — stale
              entity: sensor.front_yard_sensor_2_soil_moisture
              min: 0
              max: 100
              needle: true
              severity:
                red: 0
                yellow: 35
                green: 45
          - type: statistics-graph
            title: Moisture Trend
            chart_type: line
            days_to_show: 2
            period: hour
            stat_types:
              - mean
            entities:
              - sensor.front_yard_sensor_1_soil_moisture
              - sensor.front_yard_sensor_2_soil_moisture
      - type: grid
        cards:
          - type: heading
            heading: Front Yard Schedule
            heading_style: title
            icon: mdi:calendar-clock
          - type: tile
            entity: input_boolean.front_yard_watering_season_enabled
            name: Watering Season
            icon: mdi:sprout
            color: green
            vertical: false
          - type: tile
            entity: binary_sensor.front_yard_watering_needed
            name: Watering Needed
            icon: mdi:sprinkler-variant
            color: blue
            vertical: false
          - type: tile
            entity: sensor.front_yard_soil_moisture_lowest
            name: Driest Sensor
            icon: mdi:water-percent
            color: teal
            vertical: false
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.front_yard_local_run_available
                state: "on"
            card:
              type: button
              name: Run Now
              icon: mdi:sprinkler-variant
              tap_action:
                action: perform-action
                perform_action: script.front_yard_run_manual_watering_program
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.front_yard_local_run_available
                state_not: "on"
            card:
              type: button
              entity: sensor.front_yard_local_run_status
              name: Run Status
              show_state: true
              tap_action:
                action: none
              hold_action:
                action: none
              double_tap_action:
                action: none
          - type: conditional
            conditions:
              - condition: state
                entity: valve.rainpoint_valve_008f_valve
                state: "open"
            card:
              type: button
              name: Stop Watering
              icon: mdi:stop-circle
              tap_action:
                action: perform-action
                perform_action: valve.close_valve
                target:
                  entity_id: valve.rainpoint_valve_008f_valve
          - type: entities
            title: Decision Settings
            show_header_toggle: false
            entities:
              - entity: input_datetime.front_yard_watering_start_time
                name: Start Time
              - entity: input_number.front_yard_watering_moisture_threshold
                name: Moisture Threshold
              - entity: input_number.front_yard_watering_duration
                name: Duration
              - entity: input_number.front_yard_watering_rain_probability_threshold
                name: Rain Probability
              - entity: input_number.front_yard_watering_meaningful_rain_amount
                name: Meaningful Rain
              - entity: sensor.nws_irrigation_rain_probability_next_18_hours
                name: NWS Rain Probability
              - entity: sensor.nws_irrigation_rain_amount_next_24_hours
                name: NWS Rain Amount
          - type: entities
            title: Last Decision
            show_header_toggle: false
            entities:
              - entity: input_datetime.front_yard_watering_last_checked
                name: Last Checked
              - entity: input_datetime.front_yard_watering_last_ran
                name: Last Ran
              - entity: input_text.front_yard_watering_last_rain_forecast
                name: Rain Forecast
              - entity: input_text.front_yard_watering_last_decision
                name: Decision
      - type: grid
        cards:
          - type: heading
            heading: Front Yard Valve & Activity
            heading_style: title
            icon: mdi:valve
          - type: tile
            entity: valve.rainpoint_valve_008f_valve
            name: Water Valve
            icon: mdi:valve
            color: green
            vertical: false
          - type: tile
            entity: input_number.front_yard_watering_duration
            name: Zone Duration
            icon: mdi:timer-cog-outline
            color: amber
            vertical: false
          - type: tile
            entity: sensor.garden_valve_last_water_usage
            name: Reported Water Volume
            icon: mdi:water
          - type: history-graph
            title: Watering Activity
            hours_to_show: 24
            entities:
              - entity: valve.rainpoint_valve_008f_valve
                name: Front Yard Valve
          - type: entities
            title: Local Valve Health
            show_header_toggle: false
            entities:
              - entity: sensor.front_yard_local_run_status
                name: Run Status
              - entity: sensor.garden_valve_battery
                name: Valve Battery
              - entity: sensor.garden_valve_device_report_time
                name: Last Valve Report
              - entity: sensor.garden_valve_counter_status
                name: Counter Status
              - entity: sensor.rainpoint_valve_008f_watering_readiness_2
                name: Morning Readiness
              - entity: sensor.garden_valve_signal_strength
                name: RF Signal
          - type: entities
            title: Soil Sensor Health
            show_header_toggle: false
            entities:
              - type: section
                label: Plant Bed 1
              - entity: binary_sensor.front_yard_sensor_1_reporting
                name: Reporting
              - entity: sensor.front_yard_sensor_1_device_report_time
                name: Last Report
              - entity: sensor.front_yard_sensor_1_battery
                name: Battery
              - entity: sensor.front_yard_sensor_1_signal_strength
                name: Signal
              - type: section
                label: Plant Bed 2
              - entity: binary_sensor.front_yard_sensor_2_reporting
                name: Reporting
              - entity: sensor.front_yard_sensor_2_device_report_time
                name: Last Report
              - entity: sensor.front_yard_sensor_2_battery
                name: Battery
              - entity: sensor.front_yard_sensor_2_signal_strength
                name: Signal
          - type: history-graph
            title: Report Cadence
            hours_to_show: 24
            entities:
              - entity: sensor.front_yard_sensor_1_last_report_interval
                name: Sensor 1
              - entity: sensor.front_yard_sensor_2_last_report_interval
                name: Sensor 2
