name: Alpha test result or problem
description: Report an independent sensor, valve, radio or installation result without sharing credentials.
title: "[Alpha] "
body:
  - type: markdown
    attributes:
      value: >-
        If watering is uncertain, inspect the valve or shut off its supply first.
        Never attach Wi-Fi passwords, gateway/node tokens, HA backups, databases
        or unreviewed diagnostic archives. This form does not contact emergency support.
  - type: input
    id: versions
    attributes:
      label: Versions and source revision
      description: HA/OS, gateway app, integration, radio firmware and bundle/source commit.
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device under test
      options:
        - HCS02x soil sensor
        - HTV145FRF single-zone valve
        - HTV405FRF four-zone valve
        - Radio adoption / OTA
        - HA installation / UI
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware and network
      description: >-
        Device model/revision, ESP32/CC1101 module, power source, radio Wi-Fi RSSI,
        radio health, and whether the stock gateway was on. Omit passwords and IDs.
    validations:
      required: true
  - type: textarea
    id: procedure
    attributes:
      label: Steps and timestamp
      description: >-
        Include local time AND timezone, selected radio label, new pairing vs
        recovery, LED behavior, and what the UI reported. Say if the valve was
        dry or connected to water; include requested duration and observed stop.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
      description: >-
        Distinguish physical observations from HA state. Note later reports,
        reboot/battery changes, notification delivery, and reproducibility.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Short relevant log excerpts, screenshots and automation traces after manual review.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed credentials and unrelated private information from this report and its attachments.
          required: true
