name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run protocol, gateway, analysis, and safety tests
        run: |
          python -m unittest -v \
            test_rainpoint_protocol.py \
            test_rainpoint_pairing.py \
            test_rainpoint_pairing_protocol.py \
            test_esp32_network.py \
            test_rainpoint_network_transport.py \
            test_integration_migration.py \
            test_api_models.py \
            test_addon_boundaries.py \
            test_firmware_manifest.py \
            test_firmware_catalog.py \
            test_rainpointd.py \
            test_rainpoint_rf.py \
            test_rainpoint_analysis.py \
            test_rainpoint_safety.py \
            test_pairing_profile_analysis.py \
            test_radio_node_acceptance.py \
            test_rf_trial.py
      - name: Compile hardware-independent firmware protocol tests
        run: |
          c++ -std=c++17 -Ifirmware/rainpoint_bridge/include \
            firmware/rainpoint_bridge/tests/protocol_test.cpp \
            -o /tmp/rainpoint-protocol-test
          /tmp/rainpoint-protocol-test

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install "platformio==6.1.19"
      - name: Build the standard radio-node firmware
        run: >-
          pio run --project-dir firmware/rainpoint_bridge
          --environment rainpoint_bridge
      - name: Verify the standard firmware command boundary
        run: >-
          python tools/check_firmware_boundaries.py
          firmware/rainpoint_bridge/.pio/build/rainpoint_bridge/firmware.bin
      - name: Build and verify production OTA artifact manifest
        run: |
          python tools/firmware_manifest.py \
            firmware/rainpoint_bridge/.pio/build/rainpoint_bridge/firmware.bin \
            /tmp/rainpoint-firmware-manifest.json \
            --version 0.11.0 --environment rainpoint_bridge
          python tools/firmware_manifest.py \
            firmware/rainpoint_bridge/.pio/build/rainpoint_bridge/firmware.bin \
            /tmp/rainpoint-firmware-manifest.json --verify
