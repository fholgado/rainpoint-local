name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run protocol, gateway, analysis, and safety tests
        run: |
          python -m unittest discover -s tests -t . -v
      - name: Build reproducible source package and verify clean installation
        run: |
          python tools/package_release.py /tmp/rainpoint-release-a.tar.gz --smoke-test
          python tools/package_release.py /tmp/rainpoint-release-b.tar.gz
          cmp /tmp/rainpoint-release-a.tar.gz /tmp/rainpoint-release-b.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: rainpoint-source-release
          path: /tmp/rainpoint-release-a.tar.gz
      - name: Compile hardware-independent firmware protocol tests
        run: |
          c++ -std=c++17 -Ifirmware/rainpoint_bridge/include \
            firmware/rainpoint_bridge/tests/protocol_test.cpp \
            -o /tmp/rainpoint-protocol-test
          /tmp/rainpoint-protocol-test
          c++ -std=c++17 -Ifirmware/rainpoint_bridge/include \
            firmware/rainpoint_bridge/tests/htv145_counter2_protocol_test.cpp \
            -o /tmp/rainpoint-htv145-counter2-test
          /tmp/rainpoint-htv145-counter2-test

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install "platformio==6.1.19"
      - name: Build and check unified production firmware
        run: |
          pio run --project-dir firmware/rainpoint_bridge --environment rainpoint_bridge
          pio run --project-dir firmware/rainpoint_bridge --environment rainpoint_bridge --target release_receipt
          python tools/check_firmware_boundaries.py --supervised --htv145-pairing --htv145-control \
            firmware/rainpoint_bridge/.pio/build/rainpoint_bridge/firmware.bin
          python tools/package_alpha.py /tmp/rainpoint-alpha-candidate.zip
          python tools/package_alpha.py /tmp/rainpoint-alpha-candidate-repeat.zip
          cmp /tmp/rainpoint-alpha-candidate.zip /tmp/rainpoint-alpha-candidate-repeat.zip

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build the production app image
        run: docker build --build-arg BUILD_ARCH=amd64 --build-arg BUILD_VERSION=ci --tag rainpoint-ci rainpointd_addon
      - name: Verify the packaged runtime has no installation defaults
        run: >-
          docker run --rm --entrypoint python3 rainpoint-ci -c
          'from rainpointd.gateway import Gateway; from rainpointd.ingest import FrameIngestor;
          g=Gateway(); FrameIngestor(g).seed(); assert g.devices()==[]; g.close()'
