name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run protocol, gateway, analysis, and safety tests
        run: |
          python -m unittest -v \
            test_rainpoint_protocol.py \
            test_rainpoint_pairing.py \
            test_rainpoint_pairing_protocol.py \
            test_esp32_network.py \
            test_rainpointd.py \
            test_rainpoint_rf.py \
            test_rainpoint_analysis.py \
            test_rainpoint_safety.py
      - name: Compile hardware-independent firmware protocol tests
        run: |
          c++ -std=c++17 -Ifirmware/rainpoint_bridge/include \
            firmware/rainpoint_bridge/tests/protocol_test.cpp \
            -o /tmp/rainpoint-protocol-test
          /tmp/rainpoint-protocol-test

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install "platformio==6.1.19"
      - name: Build production and research firmware targets
        run: >-
          pio run --project-dir firmware/rainpoint_bridge
          --environment esp32dev_single
          --environment esp32dev_dual
          --environment esp32dev_single_bench
      - name: Verify production firmware excludes local TX bench controls
        run: >-
          python tools/check_firmware_boundaries.py
          firmware/rainpoint_bridge/.pio/build/esp32dev_single/firmware.bin
          firmware/rainpoint_bridge/.pio/build/esp32dev_single_bench/firmware.bin
