[platformio]
default_envs = esp32dev_single, esp32dev_dual

[env]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -std=gnu++17
  -DRAINPOINT_RX_ONLY=1
build_unflags =
  -std=gnu++11

[env:esp32dev_single]
build_flags =
  ${env.build_flags}
  -DRAINPOINT_RADIO_COUNT=1

[env:esp32dev_dual]
build_flags =
  ${env.build_flags}
  -DRAINPOINT_RADIO_COUNT=2
