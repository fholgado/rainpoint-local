[platformio]
default_envs = rainpoint_bridge

[env:rainpoint_bridge]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
extra_scripts = pre:tools/build_profile.py
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -DRAINPOINT_STATUS_LED_PIN=2
  -DRAINPOINT_CONFIRM_BUTTON_PIN=0
