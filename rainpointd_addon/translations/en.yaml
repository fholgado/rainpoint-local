configuration:
  transport:
    name: Transport
    description: Use captured replay fixtures or a receive-only USB RTL-SDR
  replay_interval:
    name: Replay interval
    description: Seconds between captured fixture observations
  frequency:
    name: Center frequency
    description: RTL-SDR center frequency in hertz
  sample_rate:
    name: Sample rate
    description: RTL-SDR sample rate in samples per second
  research_capture_minutes:
    name: Broad capture duration
    description: Minutes to save all detected raw RF signals before returning to normal decoding
  registry_write_token:
    name: Legacy gateway token override
    description: Advanced migration override; leave empty to generate and manage the gateway credential automatically
  node_listen_port:
    name: Wi-Fi node listener port
    description: TCP port for authenticated inbound ESP32 radio-node telemetry; set to 0 to disable
  node_tokens:
    name: Wi-Fi node credentials
    description: JSON object mapping each stable node ID to its unique 64-character hexadecimal token
network:
  8787/tcp: RainPoint telemetry, registry, and sensor-pairing API
  8790/tcp: Authenticated inbound telemetry from Wi-Fi radio nodes
