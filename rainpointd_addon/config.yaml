name: RainPoint Local Gateway
version: 0.16.2
slug: rainpointd
description: Local RainPoint telemetry and bounded sensor-pairing gateway
url: https://github.com/fholgado/rainpoint-local
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
stage: experimental
homeassistant: 2026.7.0
discovery:
  - rainpoint_local
ports:
  8787/tcp: 8787
  8790/tcp: 8790
ports_description:
  8787/tcp: RainPoint telemetry, registry, and sensor-pairing API
  8790/tcp: Authenticated inbound telemetry from Wi-Fi radio nodes
watchdog: http://[HOST]:[PORT:8787]/health
usb: true
map:
  - share:rw
options:
  transport: network
  replay_interval: 5.0
  frequency: 433700000
  sample_rate: 2000000
  serial_device: /dev/ttyUSB0
  serial_baud: 115200
  research_capture_minutes: 0
  registry_write_token: ""
  node_listen_port: 8790
  node_tokens: ""
  device_catalog_path: ""
  event_retention_limit: 100000
schema:
  transport: "list(network|rtl433|esp32_serial|replay)"
  replay_interval: "float(0.5,3600)"
  frequency: "int(433000000,435000000)"
  sample_rate: "int(250000,2400000)"
  serial_device: str
  serial_baud: "int(9600,921600)"
  research_capture_minutes: "int(0,240)"
  registry_write_token: str?
  node_listen_port: "list(0|8790)"
  node_tokens: str?
  device_catalog_path: str?
  event_retention_limit: "int(1000,1000000)"
