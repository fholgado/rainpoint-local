name: RainPoint Local Gateway
version: 0.1.0
slug: rainpointd
description: Read-only local RainPoint gateway using captured replay fixtures
url: https://github.com/fholgado/rainpoint-local
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
stage: experimental
homeassistant: 2026.7.0
ports:
  8787/tcp: 8787
ports_description:
  8787/tcp: Read-only RainPoint Local API
watchdog: http://[HOST]:[PORT:8787]/health
options:
  replay_interval: 5.0
schema:
  replay_interval: "float(0.5,3600)"
