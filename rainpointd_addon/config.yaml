name: RainPoint Local Gateway
version: 0.2.1
slug: rainpointd
description: Read-only local RainPoint gateway with replay and RTL-SDR support
url: https://github.com/fholgado/rainpoint-local
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
stage: experimental
homeassistant: 2026.7.0
ports:
  8787/tcp: 8787
ports_description:
  8787/tcp: Read-only RainPoint Local API
watchdog: http://[HOST]:[PORT:8787]/health
usb: true
options:
  transport: replay
  replay_interval: 5.0
  frequency: 434000000
  sample_rate: 1024000
schema:
  transport: "list(replay|rtl433)"
  replay_interval: "float(0.5,3600)"
  frequency: "int(433000000,435000000)"
  sample_rate: "int(250000,2400000)"
